<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Midi</title>
    <link rel="shortcut icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <h1>SENAI MIDI</h1>
 
    <section class="teclado">
        <button class="tecla tecla_pom">Pom</button>
        <button class="tecla tecla_clap">Clap</button>
        <button class="tecla tecla_tim">Tim</button>
 
        <button class="tecla tecla_puff">Puff</button>
        <button class="tecla tecla_splash">Splash</button>
        <button class="tecla tecla_toim">Toim</button>
 
        <button class="tecla tecla_psh">Psh</button>
        <button class="tecla tecla_tic">Tic</button>
        <button class="tecla tecla_tom">Tom</button>
    </section>

    <audio src="./assets/sounds/pom.wav" id="som_tecla_pom"></audio>
    <audio src="./assets/sounds/clap.wav" id="som_tecla_clap"></audio>
    <audio src="./assets/sounds/tim.wav" id="som_tecla_tim"></audio>

    <audio src="./assets/sounds/puff.wav" id="som_tecla_puff"></audio>
    <audio src="./assets/sounds/splash.wav" id="som_tecla_splash"></audio>
    <audio src="./assets/sounds/toim.wav" id="som_tecla_toim"></audio>

    <audio src="./assets/sounds/psh.wav" id="som_tecla_psh"></audio>

    <audio src="./assets/sounds/tom.wav" id="som_tecla_tom"></audio>
</body>
<script src="./script/app.js"></script>
